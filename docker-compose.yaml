version: "3.8"
services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
    depends_on:
      - kafka
      - redis

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"

  kafka:
    image: "bitnami/kafka:latest"
    environment:
      - KAFKA_CFG_BROKER_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
