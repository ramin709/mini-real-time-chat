apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ramin709/backend
        ports:
        - containerPort: 5000
        env:
            - name: KAFKA_HOST
              value: "kafka:9093"
            - name: KAFKA_TOPIC
              value: "chat-topic"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_USER
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_USER
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000  # Needed to forward requests correctly

